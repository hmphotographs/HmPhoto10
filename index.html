<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
 <!--   <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Progress Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Progress Timer</h1>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
                <div class="checkpoints">
                    <span class="dot" style="left: 0%"></span>
                    <span class="dot" style="left: 25%"></span>
                    <span class="dot" style="left: 50%"></span>
                    <span class="dot" style="left: 75%"></span>
                    <span class="dot" style="left: 100%"></span>
                </div>
            </div>
        </div>

        <div id="countdown-sections"></div>
    </div>

     <!-- 2nd -->
    
    <h1>Phase-Wise Timer</h1>
    
    <div class="container1">
        <div class="phase-indicator">Current Phase</div>
        <div class="active-phase" id="currentPhase">Loading...</div>
        
        <section>
        <div class="timer1" id="elapsedTime">--d --h --m --s</div>
           <p> | </p>
        <div class="timer1" id="remainingTime">--d --h --m --s</div>
        </section>
        <div class="progress-container1">
            <div class="progress-bar1" id="progressBar" style="width: 0%"></div>
        </div>
        <div class="phase-steps">
            <span>Phase 1</span>
            <span>Phase 2</span>
            <span>Phase 3</span>
            <span>Phase 4</span>
            <span>Phase 5</span>
        </div>
    </div>
    
    <script src="script.js"></script>
    
</body>
</html>
